name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify tag, package version, and changelog
        timeout-minutes: 1
        shell: bash
        run: |
          python <<'PY'
          import os
          import re
          from pathlib import Path

          from vpn_installer import VERSION

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", tag):
              raise SystemExit(f"tag is not strict SemVer: {tag}")
          if tag != VERSION:
              raise SystemExit(f"tag {tag} does not match vpn_installer.VERSION {VERSION}")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          headings = re.findall(r"^## \[([^]]+)\] - \d{4}-\d{2}-\d{2}$", changelog, re.MULTILINE)
          if not headings or headings[0] != tag:
              latest = headings[0] if headings else "missing"
              raise SystemExit(f"latest CHANGELOG release {latest} does not match tag {tag}")
          if headings.count(tag) != 1:
              raise SystemExit(f"CHANGELOG must contain exactly one release heading for {tag}")
          PY

      - name: Install bounded test dependencies
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run complete release gate
        timeout-minutes: 9
        run: python -m vpn_installer audit all --json

      - name: Preserve failed audit evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-audit-${{ github.run_id }}
          path: out/audit/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build release notes from CHANGELOG
        shell: bash
        run: |
          python <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(r"^## \[" + re.escape(tag) + r"\] - .*$", re.MULTILINE)
          match = pattern.search(changelog)
          if not match:
              raise SystemExit(f"CHANGELOG section not found for {tag}")
          start = match.start()
          next_match = re.search(r"^## \[", changelog[match.end():], re.MULTILINE)
          end = match.end() + next_match.start() if next_match else len(changelog)
          body = changelog[start:end].strip()
          Path("release-body.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-body.md
          draft: false
          prerelease: false
